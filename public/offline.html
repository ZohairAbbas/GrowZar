<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2F7F6">
  <title>Offline · Growzar</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/growzar.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; background: #F2F7F6; color: #06191D; font-family: "DM Sans", system-ui, -apple-system, sans-serif; }
    main { width: 100%; max-width: 420px; background: #fff; border-radius: 22px; padding: 32px; box-sizing: border-box; text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { margin: 20px 0 8px; font-size: 22px; }
    p { margin: 0; color: #4F6A6E; line-height: 1.5; }
    button { margin-top: 24px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 999px; background: #06191D; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/growzar.svg" alt="">
    <h1>You're offline</h1>
    <p>Growzar needs a connection to show your numbers.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
